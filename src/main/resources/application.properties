spring.application.name=fake-review-detection

spring.datasource.url=jdbc:mysql://localhost:3306/fake_review_db
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:local-dev-secret-change-before-deployment-0123456789abcdef}
app.jwt.expiration=86400000

logging.level.org.springframework.security=TRACE
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.chat.options.model=openrouter/free